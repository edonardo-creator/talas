# Mağaza uygulaması derlemesi (bulutta; bilgisayarda Android SDK ya da Mac gerekmez).
# Actions > "Mobil derleme" > Run workflow. Çıktılar çalışmanın "Artifacts" bölümünden indirilir.
# İmzalı Play paketi için depo sırlarına ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD eklenir.
name: Mobil derleme
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: python3 tools/pages.py
      - run: npx cap sync android
      - name: Deneme APK ve yayın paketi (AAB)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug bundleRelease
      - name: Paketi imzala
        if: env.HAS_KS == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > upload.jks
          jarsigner -keystore upload.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab "${{ secrets.ANDROID_KEY_ALIAS }}"
          rm upload.jks
      - uses: actions/upload-artifact@v4
        with:
          name: talas-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: python3 tools/pages.py
      - run: npx cap sync ios
      - name: Simülatör için derleme denetimi (imzasız)
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -20

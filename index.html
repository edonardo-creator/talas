<meta charset="utf-8">
<title>Talaş Atölye</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Düzen: atölye kesim matı zemini; üstte proje görseli, altta sekmeli teknik içerik; altta sabit gezinme çubuğu */
:root{
  --paper:#eceeea; --panel:#fafbf8; --sunk:#e2e5df; --ink:#1b2120; --muted:#5b6661; --line:#cfd5cf;
  --accent:#1e56c8; --accent-ink:#ffffff; --accent-soft:#dfe7f8;
  --warn:#a8501b; --warn-soft:#f6e6da; --ok:#2c7a4c; --ok-soft:#dcefe2;
  --edge:rgba(27,33,32,.62); --grid:rgba(27,33,32,.06); --dim:#3a4441;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111413; --panel:#191d1c; --sunk:#202524; --ink:#e5eae6; --muted:#97a29c; --line:#2c3331;
  --accent:#7da3ff; --accent-ink:#0b1430; --accent-soft:#1d2a47;
  --warn:#f09a63; --warn-soft:#3a2518; --ok:#6fcb97; --ok-soft:#173326;
  --edge:rgba(0,0,0,.7); --grid:rgba(255,255,255,.05); --dim:#c3ccc7; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111413; --panel:#191d1c; --sunk:#202524; --ink:#e5eae6; --muted:#97a29c; --line:#2c3331;
  --accent:#7da3ff; --accent-ink:#0b1430; --accent-soft:#1d2a47;
  --warn:#f09a63; --warn-soft:#3a2518; --ok:#6fcb97; --ok-soft:#173326;
  --edge:rgba(0,0,0,.7); --grid:rgba(255,255,255,.05); --dim:#c3ccc7; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--nav-h) + 28px)}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,52px)} h2{font-size:28px} h3{font-size:21px}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* brand */
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1 span{color:var(--accent)}
.brand .rule{flex:1;min-width:60px;height:10px;align-self:center;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10px);opacity:.35;mask:linear-gradient(#000 0 0) bottom/100% 100% no-repeat}

/* gezinme */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav a{flex:1;max-width:200px;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:12.5px;font-weight:500}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav a[aria-current="page"]{color:var(--accent)}

/* proje kartları */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.mat{background-color:var(--sunk);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
.card .pic{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;padding:14px;position:relative}
.card .pic svg{width:100%;height:100%}
.card .body{padding:14px 16px 16px;display:grid;gap:8px}
.card h3{font-size:23px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.lvl i{display:inline-block;width:6px;height:10px;border-radius:1px;background:var(--line)}
.lvl i.on{background:var(--accent)}
.fav{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.fav svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.7}
.fav[aria-pressed="true"] svg{fill:var(--warn);stroke:var(--warn)}
.prog{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}

/* proje sayfası */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;min-height:44px}
.phead{display:grid;gap:10px;margin-bottom:18px}
.layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:12px;display:grid;gap:14px}
@media (max-width:860px){.side{position:static}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.viewer{position:relative;aspect-ratio:1/0.82;max-width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.viewer svg{width:100%;height:100%;display:block}
.vtoggle{position:absolute;left:10px;bottom:10px;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.vtoggle button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;min-height:34px}
.vtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.params{padding:14px 16px;display:grid;gap:12px}
.params header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prm{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.prm label{font-size:14px}
.prm input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);min-height:28px}
.prm .num{display:flex;align-items:center;gap:4px}
.prm input[type=number]{width:76px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-family:var(--f-mono);text-align:right}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;min-height:40px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.facts div{background:var(--panel);padding:10px 14px}
.facts b{display:block;font:500 11px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts span{font-size:16px;font-weight:500}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;min-height:44px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.sec{display:grid;gap:14px;margin-bottom:26px}
.sec > header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.prose{max-width:65ch;display:grid;gap:10px}
.note{padding:10px 14px;border-radius:6px;font-size:14px;display:flex;gap:10px}
.note.warn{background:var(--warn-soft);color:var(--ink)} .note.warn b{color:var(--warn)}
.note.tip{background:var(--accent-soft)} .note.tip b{color:var(--accent)}
.note.ok{background:var(--ok-soft)} .note.ok b{color:var(--ok)}

.pn{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:999px;border:1.5px solid currentColor;font:600 12px/1 var(--f-mono);vertical-align:1px}

/* kesim listesi */
.cl{display:grid;gap:8px}
.cl-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.cl-item .pn{width:30px;height:30px;font-size:13px}
.cl-item .d{font:500 17px/1.3 var(--f-mono);font-variant-numeric:tabular-nums}
.cl-item .s{font-size:13px;color:var(--muted)}
.cl-item.done{opacity:.55}
.cl-item.done .d{text-decoration:line-through}
.check{appearance:none;width:26px;height:26px;border:1.6px solid var(--muted);border-radius:50%;display:grid;place-items:center;margin:0;cursor:pointer}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";width:7px;height:12px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-2px) rotate(45deg)}
:root .check:checked::after{border-color:var(--panel)}
.matgroup{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.matgroup h3{font-size:19px}

.boards{display:grid;gap:10px}
.board{display:grid;gap:4px}
.board .bar{display:flex;height:42px;border:1px solid var(--edge);border-radius:2px;overflow:hidden;background:repeating-linear-gradient(45deg,var(--sunk) 0 6px,var(--panel) 6px 12px)}
.board .seg{flex:none;height:100%;display:grid;place-items:center;font:600 12px var(--f-mono);color:#2a1d0e;border-right:1px solid var(--edge);overflow:hidden;white-space:nowrap}
.board .kerf{flex:none;height:100%;background:var(--ink);opacity:.5}
.board small{font:12px var(--f-mono);color:var(--muted)}
.sheet{max-width:100%;overflow-x:auto}
.sheet svg{width:100%;max-width:640px;height:auto;display:block}
.opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
.opts select{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);min-height:36px}
.opts label{display:flex;gap:8px;align-items:center;min-height:36px}

/* listeler */
.list{display:grid;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .t{font-weight:500}
.row .s{font-size:13px;color:var(--muted)}
.row .q{font:500 15px var(--f-mono);white-space:nowrap}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tool{display:grid;gap:6px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;align-content:start}
.tool .ic{width:44px;height:44px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.tool .ic svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool .n{font-weight:600;font-size:14px;line-height:1.3}
.tool .s{font-size:12.5px;color:var(--muted)}
.tool label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);min-height:30px}
.tool label input{accent-color:var(--ok);width:18px;height:18px}
.tool.have{border-color:var(--ok)}

/* planlar */
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.plans figure{margin:0;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.plans figure svg{width:100%;height:auto;display:block;max-height:300px}
.plans figcaption{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
@media (max-width:520px){.plans{grid-template-columns:minmax(0,1fr)}}

/* yapım modu */
.player{display:grid;gap:12px}
.stepbar{display:flex;gap:4px}
.stepbar button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);padding:0;min-width:0}
.stepbar button.done{background:var(--ok)}
.stepbar button.cur{background:var(--accent)}
.stepcard{padding:16px;display:grid;gap:12px}
.stepcard h3{font-size:25px}
.stepcard .txt{display:grid;gap:8px;max-width:65ch}
.stepcard .txt ul{margin:0;padding-left:20px;display:grid;gap:3px}
.stepnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.stepnav .btn{flex:1;min-width:120px;min-height:48px;font-size:15px}
.mini{display:flex;gap:6px;flex-wrap:wrap}

/* rehber */
.woods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.wood{padding:14px;display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.swatch{height:54px;border-radius:4px;border:1px solid var(--edge)}
.bars{display:grid;gap:4px;font-size:12.5px}
.bars div{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px}
.bars i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--v),var(--sunk) var(--v))}
.toc{display:flex;gap:8px;flex-wrap:wrap}

/* svg sınıfları */
.f{stroke:var(--edge);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.nw .f{stroke:var(--accent);stroke-width:2}
.gh{fill:none;stroke:var(--muted);stroke-width:.8;stroke-dasharray:3 3;opacity:.55;vector-effect:non-scaling-stroke}
.lbl circle{fill:var(--panel);stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke}
.lbl text{fill:var(--ink);font-family:var(--f-mono);font-weight:600;text-anchor:middle;dominant-baseline:central}
.lbl line{stroke:var(--ink);stroke-width:.9;vector-effect:non-scaling-stroke}
.lbl.nw circle{fill:var(--accent);stroke:var(--accent)} .lbl.nw text{fill:var(--accent-ink)}
.orect{stroke:var(--edge);stroke-width:1;vector-effect:non-scaling-stroke}
.dimln{stroke:var(--dim);stroke-width:.9;fill:none;vector-effect:non-scaling-stroke}
.dimtx{fill:var(--dim);font-family:var(--f-mono);text-anchor:middle}
.shrect{fill:var(--sunk);stroke:var(--edge);vector-effect:non-scaling-stroke}
.shp{stroke:var(--edge);vector-effect:non-scaling-stroke}
.shtx{fill:#2a1d0e;font-family:var(--f-mono);font-weight:600;text-anchor:middle;dominant-baseline:central}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px;display:grid;gap:10px;justify-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
"use strict";
/* ---------- kayıt ---------- */
const KEY='talas.v1';
let SAVE={params:{},steps:{},cut:{},have:{},fav:{},shop:{},opt:{rot:false,lumL:2400}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) SAVE=Object.assign(SAVE,s);}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}

/* ---------- malzemeler ---------- */
const MAT={
  beech:{n:'Kayın şerit 30×40',type:'lumber',w:40,t:30,L:2000,tone:'beech'},
  walnut:{n:'Ceviz şerit 30×40',type:'lumber',w:40,t:30,L:2000,tone:'walnut'},
  p45:{n:'Çam kereste 45×45',type:'lumber',w:45,t:45,tone:'pine'},
  p30:{n:'Çam kereste 30×30',type:'lumber',w:30,t:30,tone:'pine'},
  p2095:{n:'Çam kereste 20×95',type:'lumber',w:95,t:20,tone:'pine'},
  p2070:{n:'Çam kereste 20×70',type:'lumber',w:70,t:20,tone:'pine'},
  p2045:{n:'Çam kereste 20×45',type:'lumber',w:45,t:20,tone:'pine'},
  ply18:{n:'Huş kontrplak 18 mm',type:'sheet',t:18,SW:2440,SH:1220,tone:'ply'},
  ply12:{n:'Huş kontrplak 12 mm',type:'sheet',t:12,SW:2440,SH:1220,tone:'ply'},
  hdf4:{n:'HDF arkalık 4 mm',type:'sheet',t:4,SW:2440,SH:1220,tone:'hdf'},
  ply6:{n:'Huş kontrplak 6 mm',type:'sheet',t:6,SW:2440,SH:1220,tone:'ply'},
  mdf18:{n:'MDF 18 mm (boyanacak)',type:'sheet',t:18,SW:2800,SH:2100,tone:'paint'},
  mlam18:{n:'Beyaz suntalam 18 mm',type:'sheet',t:18,SW:3660,SH:1830,tone:'mlam'},
  cork5:{n:'Mantar levha 5 mm',type:'sheet',t:5,SW:1000,SH:600,tone:'cork'},
  kav20:{n:'Kavela çubuk Ø20 (kayın)',type:'lumber',w:20,t:20,L:1000,tone:'beech'},
  kav25:{n:'Kavela çubuk Ø25 (kayın)',type:'lumber',w:25,t:25,L:1000,tone:'beech'},
  rubber:{n:'Lastik',type:'hw',tone:'rubber'},
  steel:{n:'Metal',type:'hw',tone:'steel'},
  glass:{n:'Cam / ayna',type:'hw',tone:'glass'},
  hole:{n:'Açıklık',type:'hw',tone:'hole'}
};
const TONE={pine:[37,62,71],ply:[38,40,79],hdf:[26,32,44],walnut:[22,36,33],beech:[26,55,69],rubber:[200,6,24],steel:[210,8,68],
  emp:[75,20,60],oak:[33,42,60],maple:[40,48,83],paint:[200,10,86],mlam:[45,12,93],cork:[28,42,56],glass:[195,30,82],hole:[30,25,14]};
function stockL(m){return MAT[m].L||SAVE.opt.lumL;}

/* ---------- araçlar ---------- */
const IC={
  pencil:'<path d="M5 19l2-6 9-9 4 4-9 9z"/><path d="M7 13l4 4"/>',
  tape:'<circle cx="11" cy="12" r="7"/><circle cx="11" cy="12" r="2.5"/><path d="M18 17h4"/>',
  square:'<path d="M4 4v16h16v-4H8V4z"/>',
  level:'<rect x="2" y="9" width="20" height="6" rx="1"/><rect x="10" y="10.5" width="4" height="3" rx="1"/>',
  saw:'<path d="M3 15l14-9 3 3-14 9z"/><path d="M6 13l1 2M9 11l1 2M12 9l1 2"/>',
  circ:'<circle cx="12" cy="13" r="6"/><path d="M4 8h16"/><circle cx="12" cy="13" r="1.5"/>',
  miter:'<circle cx="12" cy="10" r="5"/><path d="M3 19h18M12 15v4M7 5l-3-2"/>',
  jig:'<path d="M5 20V9h14v11"/><path d="M12 9V4"/><path d="M9 20l3-6 3 6"/>',
  drill:'<path d="M4 8h11v6H4z"/><path d="M15 10h5M9 14l-1 6h4l1-6"/>',
  bit:'<path d="M12 3v14l-2 4h4l-2-4"/><path d="M9 7l6 2M9 11l6 2"/>',
  pocket:'<rect x="5" y="4" width="14" height="16" rx="1"/><path d="M9 8l6 8M11 8l6 8"/>',
  clamp:'<path d="M6 3v18M6 4h10v4M6 20h10v-4M16 8v8"/>',

const R=Math.round;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mk(){const parts=[];return{parts,A:(g,name,mat,x,y,z,sx,sy,sz,o={})=>parts.push(Object.assign({g,name,mat,x,y,z,sx,sy,sz},o))};}
function cutDims(p){return p.cut||[p.sx,p.sy,p.sz].sort((a,b)=>b-a);}
function spread(n,from,to,size){ // n parçayı aralığa eşit boşlukla yay
  if(n<=1) return [from+(to-from-size)/2];
  const g=(to-from-n*size)/(n-1); return Array.from({length:n},(_,i)=>from+i*(size+g));
}

  return `<a class="card" href="#${pr.id}"><div class="pic mat">${iso(c.parts,{aria:pr.name})}<button class="fav" data-fav="${pr.id}" aria-pressed="${!!SAVE.fav[pr.id]}" aria-label="Favorilere ekle">${heart}</button></div>
  <div class="body"><div class="eyebrow">${esc(pr.cat||'')}</div><h3>${esc(pr.name)}</h3><div class="meta">${lvl(pr.level)}<span class="tag">${clockI}${esc(pr.time)}</span></div>
  <p class="muted mono" style="font-size:13px">${c.dims.join(' × ')} mm · ${c.parts.filter(q=>MAT[q.mat].type!=='hw').length} parça</p>
  ${pg.d?`<div class="prog" title="${pg.d}/${pg.n} adım"><i style="width:${pg.d/pg.n*100}%"></i></div>`:''}</div></a>`;
}
const Q={cat:'',lvl:0,q:'',fam:'',page:1};
const trl=s=>s.toLocaleLowerCase('tr');
function filtered(){const words=trl(Q.q).split(/\s+/).filter(Boolean);
  return PROJECTS.filter(p=>(!Q.cat||p.cat===Q.cat)&&(!Q.lvl||p.level===Q.lvl)&&(!Q.fam||p.fam===Q.fam)&&(!words.length||words.every(w=>p._s.includes(w))));}
function viewHome(){
  PROJECTS.forEach(p=>{if(!p._s)p._s=trl(p.name+' '+(p.cat||'')+' '+(p.famName||'')+' '+(p.tags||''));});
  const fams=[...new Map(PROJECTS.filter(p=>p.fam).map(p=>[p.fam,p.famName])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'tr'));
  app.innerHTML=`<div class="brand"><h1>Talaş<span>.</span></h1><div class="rule"></div></div>
  <p class="muted" style="max-width:60ch;margin:6px 0 22px">${PROJECTS.length} ahşap ürün, ${fams.length+FEATURED.length} aile. Ölçüsünü sen ver; kesim listesi, kereste ve plaka yerleşimi, ekipman ve adım adım yapım kılavuzu o ölçüye göre hazırlanır.</p>
  <div class="sec"><header><h2>Öne çıkanlar</h2><span class="muted" style="font-size:13px">Elle yazılmış ayrıntılı kılavuzlar</span></header><div class="grid">${FEATURED.slice(0,3).map(card).join('')}</div></div>
  <div class="sec"><header><h2>Katalog</h2></header>
  <div style="display:grid;gap:10px">
    <input id="q" type="search" placeholder="Ara: kitaplık, meşe, bahçe, çekmeceli…" value="${esc(Q.q)}" aria-label="Katalogda ara" style="padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-height:44px;width:100%">
    <div class="chips" role="group" aria-label="Kategori">${['',...CATS].map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${Q.cat===c}">${c||'Tümü'}</button>`).join('')}</div>
    <div class="opts"><label for="lvlSel">Zorluk <select id="lvlSel">${['Hepsi','Kolay','Orta','İleri'].map((t,i)=>`<option value="${i}" ${Q.lvl===i?'selected':''}>${t}</option>`).join('')}</select></label>
    <label for="famSel">Aile <select id="famSel"><option value="">Tüm aileler</option>${fams.map(([id,n])=>`<option value="${id}" ${Q.fam===id?'selected':''}>${esc(n)}</option>`).join('')}</select></label></div>
  </div><div id="catalog" style="display:grid;gap:14px"></div></div>`;
  renderCatalog();
}
function renderCatalog(){
  const list=filtered(), n=Q.page*24;
  document.getElementById('catalog').innerHTML=`<p class="muted mono" style="font-size:13px">${list.length} ürün</p>
  ${list.length?`<div class="grid">${list.slice(0,n).map(card).join('')}</div>`:`<div class="empty">Aramana uyan ürün yok. Daha kısa bir kelime dene ya da filtreleri temizle.<button class="btn" data-clear="1">Filtreleri temizle</button></div>`}
  ${list.length>n?`<button class="btn" data-more="1" style="justify-self:center;min-width:220px">Daha fazla göster (${list.length-n} kaldı)</button>`:''}`;
}
function viewProject(id){
  const pr=BYID[id]; const p=params(pr);
  CUR={pr,p,c:compute(pr,p),tab:CUR&&CUR.pr===pr?CUR.tab:'genel',view:CUR&&CUR.pr===pr?CUR.view:'iso'};
  app.innerHTML=`<a class="back" href="#projeler">← Projeler</a>
  <div class="phead"><div class="eyebrow">${esc(pr.join)}</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><h1>${esc(pr.name)}</h1><button class="fav" style="position:static;flex:none" data-fav="${pr.id}" aria-pressed="${!!SAVE.fav[pr.id]}" aria-label="Favorilere ekle">${heart}</button></div>
  <div class="meta">${lvl(pr.level)}<span class="tag">${clockI}${esc(pr.time)}</span></div></div>
  <div class="layout"><div class="side">
    <div class="viewer mat" id="viewer"></div>
    <div class="facts" id="facts"></div>
    <div class="panel params"><header><h3>Ölçüler</h3><button class="btn sm" id="reset">Varsayılana dön</button></header>
    ${pr.params.map(q=>`<div class="prm"><label for="r-${q.k}">${esc(q.l)}</label><span class="num"><input type="number" id="n-${q.k}" min="${q.min}" max="${q.max}" step="${q.step}" value="${p[q.k]}" data-k="${q.k}" aria-label="${esc(q.l)}"><span class="muted" style="font-size:13px">${q.k==='N'?'adet':'mm'}</span></span>
      <input type="range" id="r-${q.k}" min="${q.min}" max="${q.max}" step="${q.step}" value="${p[q.k]}" data-k="${q.k}"></div>`).join('')}
    </div></div>
    <div style="min-width:0"><div class="tabs" role="tablist">${[['genel','Genel'],['kesim','Kesim listesi'],['malzeme','Malzeme'],['ekipman','Ekipman'],['plan','Planlar'],['yapim','Yapım']].map(([k,t])=>`<button role="tab" data-tab="${k}" aria-selected="${CUR.tab===k}">${t}</button>`).join('')}</div>
    <div id="tabbody"></div></div></div>`;
  refresh();
}
function refresh(){
  const {pr,c}=CUR;
  const v=document.getElementById('viewer');
  if(CUR.tab==='yapim'){const si=curStep();v.innerHTML=iso(c.parts,{state:q=>q.step<si?'old':q.step===si?'new':'ghost',labels:'new',gnum:c.gnum});}
  else v.innerHTML=iso(c.parts,{explode:CUR.view==='exp'?.55:0,labels:CUR.view==='exp',gnum:c.gnum,aria:pr.name})+`<div class="vtoggle" role="group" aria-label="Görünüm"><button data-view="iso" aria-pressed="${CUR.view==='iso'}">Montajlı</button><button data-view="exp" aria-pressed="${CUR.view==='exp'}">Parçalara ayrılmış</button></div>`;
  const st=stock(c);
  document.getElementById('facts').innerHTML=`<div><b>Bitmiş ölçü</b><span class="mono">${c.dims.join(' × ')} mm</span></div><div><b>Ahşap</b><span>${esc(pr.wood||woodOf(c))}</span></div><div><b>Parça</b><span class="mono">${c.parts.filter(q=>MAT[q.mat].type!=='hw').length} adet · ${c.groups.filter(g=>!g.hw).length} çeşit</span></div><div><b>Alınacak</b><span class="mono">${st.map(s=>s.count+' '+(s.type==='sheet'?'plaka':'boy')).join(' + ')}</span></div>`;
  const T=document.getElementById('tabbody'); T.innerHTML=TABS[CUR.tab]();
}
function curStep(){const s=SAVE.steps[CUR.pr.id]||[];const n=CUR.c.steps.length;if(CUR.step==null){let i=s.findIndex(x=>!x);CUR.step=i<0?0:i;}return Math.min(CUR.step,n-1);}
const TABS={
  genel(){const {pr,c,p}=CUR; const notes=(pr.notes(p,c)||[]).filter(Boolean);
    return `<div class="sec prose"><p>${esc(pr.desc)}</p></div>
    ${notes.length?`<div class="sec">${notes.map(n=>`<div class="note ${n.t}"><b>${n.t==='warn'?'Dikkat':'Not'}</b><span>${esc(n.x)}</span></div>`).join('')}</div>`:''}
    <div class="sec"><header><h2>Parçalar</h2><span class="muted" style="font-size:13px">Numaralar tüm sekmelerde aynı</span></header>
    <div class="list">${c.groups.map((g,i)=>`<div class="row"><div><div class="t"><b class="pn">${i+1}</b> ${esc(g.name)}</div><div class="s">${g.hw?'Hırdavat':esc(MAT[g.mat].n)}</div></div><span class="q">×${g.parts.length}</span></div>`).join('')}</div></div>
    <div class="sec"><header><h2>Yapım akışı</h2></header><div class="list">${c.steps.map((s,i)=>`<div class="row"><div class="t">${i+1}. ${esc(s.t)}</div><span class="q">${(SAVE.steps[pr.id]||[])[i]?'✓':''}</span></div>`).join('')}</div>
    <button class="btn primary" data-tab="yapim" style="justify-self:start;min-width:200px">Yapıma başla</button></div>`;},
  kesim(){const {pr,c}=CUR; const rows=cutRows(c), done=SAVE.cut[pr.id]||{};
    const byMat={};rows.forEach(r=>{(byMat[r.mat]=byMat[r.mat]||[]).push(r);});
    const st=stock(c);
    return `<div class="sec"><header><h2>Kesim listesi</h2><span class="muted mono" style="font-size:13px">uzunluk × en × kalınlık</span></header>
    ${Object.entries(byMat).map(([m,rs])=>`<div class="matgroup"><h3>${esc(MAT[m].n)}</h3><span class="muted" style="font-size:13px">${rs.reduce((a,r)=>a+r.n,0)} parça</span></div>
    <div class="cl">${rs.map(r=>{const k=r.g+':'+r.d.join('x')+(r.note||'');const w=MAT[m].type==='lumber'&&r.d[1]<MAT[m].w;
      return `<label class="cl-item ${done[k]?'done':''}"><b class="pn">${r.num}</b><div><div class="d">${r.d.join(' × ')} mm</div><div class="s">${esc(r.name)} · Adet: ${r.n}${w?` · ${MAT[m].w} mm'den boyuna kes`:''}${r.note?` · <b>${esc(r.note)}</b>`:''}</div></div><input type="checkbox" class="check" data-cut="${esc(k)}" ${done[k]?'checked':''} aria-label="Kesildi"></label>`;}).join('')}</div>`).join('')}
    </div>
    <div class="sec"><header><h2>Kesim yerleşimi</h2></header>
    <div class="opts"><label for="lumL">Kereste boyu <select id="lumL">${[2000,2400,3000,4000].map(v=>`<option ${SAVE.opt.lumL==v?'selected':''}>${v}</option>`).join('')}</select></label>
    <label><input type="checkbox" id="rot" ${SAVE.opt.rot?'checked':''}> Plakada parça döndürmeye izin ver</label></div>
    <p class="muted" style="font-size:13px">Testere payı kerestede 3 mm, plakada 4 mm; kereste başında 10 mm uç temizleme payı ayrıldı. Taralı alan artan parçadır.</p>
    ${st.map(s=>`<div class="matgroup"><h3>${esc(s.M.n)}</h3><span class="muted mono" style="font-size:13px">${s.count} ${s.type==='sheet'?'plaka':'boy'} · verim %${R(s.eff*100)}</span></div>
      ${s.pk.over.length?`<div class="note warn"><b>Dikkat</b><span>${s.pk.over.length} parça stok boyundan uzun; daha uzun kereste ya da plaka seç.</span></div>`:''}
      ${s.type==='lumber'?lumberHTML(s):sheetHTML(s)}`).join('')}
    </div>`;},
  malzeme(){const {pr,c}=CUR; const st=stock(c), sh=SAVE.shop[pr.id]||{};
    const it=(k,t,s,q)=>`<label class="row" style="grid-template-columns:auto minmax(0,1fr) auto"><input type="checkbox" class="check" data-shop="${esc(k)}" ${sh[k]?'checked':''} aria-label="Alındı"><div><div class="t">${esc(t)}</div>${s?`<div class="s">${esc(s)}</div>`:''}</div><span class="q">${esc(q)}</span></label>`;
    return `<div class="sec"><header><h2>Alışveriş listesi</h2><span class="muted" style="font-size:13px">Aldıklarını işaretle</span></header>
    <div class="list">${st.map(s=>it('m:'+s.m,s.M.n,s.type==='sheet'?`${s.M.SW}×${s.M.SH} mm plaka`:`${s.L} mm boy`,'×'+s.count)).join('')}</div></div>
    <div class="sec"><header><h2>Hırdavat ve sarf</h2></header><div class="list">${c.hw.map(h=>it('h:'+h[0],h[0],h[2],h[1])).join('')}</div></div>
    <div class="note tip"><b>İpucu</b><span>Kerestede %10 fire payı bırak. Budaklı ya da çatlak bir boy çıkarsa elinde yedek olur.</span></div>`;},
  ekipman(){const {pr,p,c}=CUR; const list=pr.tools(p,c).concat(SAFETY);
    const byCat={};list.forEach(([id,note])=>{(byCat[TOOLS[id].c]=byCat[TOOLS[id].c]||[]).push([id,note]);});
    const have=list.filter(([id])=>SAVE.have[id]).length;
    return `<div class="sec"><header><h2>Ekipman</h2><span class="muted mono" style="font-size:13px">${have}/${list.length} elinde</span></header>
    ${TOOLCATS.filter(k=>byCat[k]).map(k=>`<div class="matgroup"><h3>${k}</h3></div><div class="tools">${byCat[k].map(([id,note])=>toolCard(id,note)).join('')}</div>`).join('')}</div>`;},
  plan(){const {c}=CUR; const ps=c.parts.filter(q=>q.g!=='slide');
    return `<div class="sec"><header><h2>Planlar</h2><span class="muted mono" style="font-size:13px">ölçüler mm</span></header>
    <div class="plans"><figure><figcaption>Önden</figcaption>${ortho(ps,'front')}</figure><figure><figcaption>Yandan</figcaption>${ortho(ps,'side')}</figure><figure><figcaption>Üstten</figcaption>${ortho(ps,'top')}</figure><figure class="mat"><figcaption>Parçalara ayrılmış</figcaption>${iso(c.parts,{explode:.55,labels:true,gnum:c.gnum})}</figure></div></div>`;},
  yapim(){const {pr,c}=CUR; const si=curStep(), s=c.steps[si], d=SAVE.steps[pr.id]||[];
    const newG=[...new Set(s.add||[])];
    return `<div class="player"><div class="stepbar">${c.steps.map((x,i)=>`<button data-step="${i}" class="${i===si?'cur':d[i]?'done':''}" aria-label="Adım ${i+1}: ${esc(x.t)}"></button>`).join('')}</div>
    <div class="panel stepcard"><div class="eyebrow">Adım ${si+1} / ${c.steps.length}</div><h3>${esc(s.t)}</h3>
    ${newG.length?`<div class="mini">${newG.map(g=>`<span class="tag">${c.K(g)} ${esc(c.groups[c.gnum[g]-1].name)} ×${c.groups[c.gnum[g]-1].parts.length}</span>`).join('')}</div>`:''}
    <div class="txt">${s.x}</div>
    ${s.tip?`<div class="note tip"><b>İpucu</b><span>${esc(s.tip)}</span></div>`:''}
    ${s.warn?`<div class="note warn"><b>Dikkat</b><span>${esc(s.warn)}</span></div>`:''}
    ${s.tools&&s.tools.length?`<div><div class="eyebrow" style="margin-bottom:6px">Bu adımda</div><div class="mini">${s.tools.map(t=>`<span class="tag">${esc(TOOLS[t].n)}</span>`).join('')}</div></div>`:''}
    <label style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" class="check" id="stepdone" ${d[si]?'checked':''}> Bu adımı tamamladım</label></div>
    <div class="stepnav"><button class="btn" data-go="-1" ${si===0?'disabled':''}>← Önceki</button><button class="btn primary" data-go="1">${si===c.steps.length-1?'Bitir':'Sonraki →'}</button></div>
    ${d.filter(Boolean).length===c.steps.length?`<div class="note ok"><b>Bitti</b><span>Tüm adımlar tamam. Eline sağlık!</span></div>`:''}
    <p class="muted" style="font-size:13px">Görselde mavi çerçeveli parçalar bu adımda eklenenler; kesik çizgililer sonraki adımlarda gelecek.</p></div>`;}
};
function toolCard(id,note){const t=TOOLS[id];return `<div class="tool ${SAVE.have[id]?'have':''}"><span class="ic"><svg viewBox="0 0 24 24">${IC[t.i]}</svg></span><span class="n">${esc(t.n)}</span>${note?`<span class="s">${esc(note)}</span>`:''}${t.alt?`<span class="s">${esc(t.alt)}</span>`:''}<label><input type="checkbox" data-have="${id}" ${SAVE.have[id]?'checked':''}> Bende var</label></div>`;}

    pr.tools(params(pr),compute(pr,params(pr))).forEach(([id])=>{(used[id]=used[id]||new Set()).add(pr.famName||pr.name);});});
  const W=[
    ['Çam','pine',35,90,25,'Ucuz, hafif, her yerde bulunur. Budaklıdır, yumuşak olduğu için kolay ezilir. İç mekân mobilya ve atölye işleri için ideal.'],

    ['Ceviz','walnut',65,75,95,'Koyu, sıcak renkli, değerli. Küçük parçalarda kontrast için kullanılır. İşlenmesi keyiflidir.'],
    ['Huş kontrplak','ply',60,80,55,'Kat kat yapıştırılmış, boyutsal olarak çok kararlı. Kenarındaki katmanlar görünür; dolap ve raf gövdeleri için birinci tercih.'],
    ['MDF / HDF','hdf',45,65,20,'Düzgün yüzeyli, boyaya uygun, ucuz. Suya dayanıksızdır, vida tutması zayıftır. Arkalık ve boyalı kapaklar için.']
  ];
  const J=[['Cep vidası','Parçanın görünmeyen yüzünden açılı delik açılıp vidalanır. Hızlı ve güçlü; çerçeve ve kayıt birleşimlerinde kullanılır.','Tabure, sehpa'],
    ['Konfirmat','Kademeli delik ve kalın dişli mobilya vidası. Plaka malzemede (kontrplak, suntalam) gövde kurmanın standart yolu.','Kitaplık, komodin'],
    ['Tutkal + işkence','Geniş yüzeyli birleşimlerde tutkal ahşaptan daha güçlüdür. İşkence, kuruyana kadar yüzeyleri sıkı tutar.','Kesme tahtası, tabla'],
    ['Dübel','8 mm yuvarlak kavelaya tutkal sürülerek iki parça birleştirilir. Vida izi istenmeyen yerlerde.','Cep vidası yerine']];
  app.innerHTML=`<h1>Rehber</h1><p class="muted" style="margin:6px 0 18px;max-width:60ch">Ahşap türleri, birleştirme yöntemleri ve projelerde kullanılan bütün aletler.</p>

    <div class="bars"><div><span>Sertlik</span><i style="--v:${w[2]}%"></i></div><div><span>İşlenebilirlik</span><i style="--v:${w[3]}%"></i></div><div><span>Fiyat</span><i style="--v:${w[4]}%"></i></div></div><p class="muted" style="font-size:14px">${w[5]}</p></div>`).join('')}</div></div>

function viewMine(){
  const fav=PROJECTS.filter(p=>SAVE.fav[p.id]);
  const started=PROJECTS.filter(p=>progress(p).d>0);
  const haveN=Object.keys(SAVE.have).filter(k=>SAVE.have[k]).length;
  app.innerHTML=`<h1>Defterim</h1><p class="muted" style="margin:6px 0 18px">Kaydettiklerin bu tarayıcıda saklanır.</p>

  <div class="sec"><header><h2>Favoriler</h2></header>${fav.length?`<div class="grid">${fav.map(card).join('')}</div>`:`<div class="empty">Kalp simgesine dokunduğun projeler burada toplanır.</div>`}</div>
  <div class="sec"><header><h2>Alet çantam</h2><span class="muted mono" style="font-size:13px">${haveN}/${Object.keys(TOOLS).length}</span></header>
  <p class="muted" style="font-size:14px">${haveN?'Elindeki aletler: '+Object.keys(TOOLS).filter(k=>SAVE.have[k]).map(k=>TOOLS[k].n).join(', ')+'.':'Rehber ya da proje ekipman sekmesinde "Bende var" işaretle.'}</p>
  ${[...new Set(fav.concat(started))].map(pr=>{const need=[...new Set(pr.tools(params(pr),compute(pr,params(pr))).map(t=>t[0]))].filter(id=>!SAVE.have[id]&&!/isteğe/.test((pr.tools(params(pr),compute(pr,params(pr))).find(t=>t[0]===id)||[])[1]||''));return haveN?`<div class="row" style="background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:6px"><div><div class="t">${esc(pr.name)}</div><div class="s">${need.length?'Eksik: '+need.map(id=>TOOLS[id].n).join(', '):'Tüm aletler hazır'}</div></div><span class="q" style="color:${need.length?'var(--muted)':'var(--ok)'}">${need.length?need.length+' eksik':'✓'}</span></div>`:'';}).join('')}
  </div>`;
}

/* ---------- yönlendirme ---------- */
function route(){
  const h=(location.hash||'').slice(1)||'projeler';
  const sect=BYID[h]?'projeler':['rehber','defterim'].includes(h)?h:'projeler';
  document.querySelectorAll('.nav a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.nav===sect)||a.setAttribute('aria-current',a.dataset.nav===sect?'page':'false'));
  document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.nav===sect)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  if(BYID[h]) viewProject(h); else {CUR=null; if(h==='rehber')viewGuide(); else if(h==='defterim')viewMine(); else viewHome();}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('DOMContentLoaded',route);

/* ---------- olaylar ---------- */
let rt=0;
function setParam(k,v){const q=CUR.pr.params.find(x=>x.k===k);v=Math.max(q.min,Math.min(q.max,+v||q.def));CUR.p[k]=v;
  (SAVE.params[CUR.pr.id]=SAVE.params[CUR.pr.id]||{})[k]=v;persist();
  document.getElementById('r-'+k).value=v; if(document.activeElement.id!=='n-'+k) document.getElementById('n-'+k).value=v;
  cancelAnimationFrame(rt);rt=requestAnimationFrame(()=>{CUR.c=compute(CUR.pr,CUR.p);refresh();});}
let qt=0;
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){clearTimeout(qt);qt=setTimeout(()=>{Q.q=t.value;Q.page=1;renderCatalog();},150);return;}
  if(CUR&&t.dataset.k&&t.type==='range') setParam(t.dataset.k,t.value);
  if(CUR&&t.dataset.k&&t.type==='number'&&t.value!=='') {const q=CUR.pr.params.find(x=>x.k===t.dataset.k); if(+t.value>=q.min&&+t.value<=q.max) setParam(t.dataset.k,t.value);}
});
document.addEventListener('change',e=>{const t=e.target;
  if(CUR&&t.dataset.k&&t.type==='number') setParam(t.dataset.k,t.value);
  if(t.dataset.cut){const m=SAVE.cut[CUR.pr.id]=SAVE.cut[CUR.pr.id]||{};m[t.dataset.cut]=t.checked;persist();t.closest('.cl-item').classList.toggle('done',t.checked);}
  if(t.dataset.shop){const m=SAVE.shop[CUR.pr.id]=SAVE.shop[CUR.pr.id]||{};m[t.dataset.shop]=t.checked;persist();}
  if(t.dataset.have){SAVE.have[t.dataset.have]=t.checked;persist();t.closest('.tool').classList.toggle('have',t.checked);if(CUR&&CUR.tab==='ekipman')refresh();}
  if(t.id==='lvlSel'){Q.lvl=+t.value;Q.page=1;renderCatalog();}
  if(t.id==='famSel'){Q.fam=t.value;Q.page=1;renderCatalog();}
  if(t.id==='lumL'){SAVE.opt.lumL=+t.value;persist();refresh();}
  if(t.id==='rot'){SAVE.opt.rot=t.checked;persist();refresh();}
  if(t.id==='stepdone'){const a=SAVE.steps[CUR.pr.id]=SAVE.steps[CUR.pr.id]||[];a[curStep()]=t.checked;persist();refresh();}
});
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.fav){e.preventDefault();e.stopPropagation();SAVE.fav[t.dataset.fav]=!SAVE.fav[t.dataset.fav];persist();document.querySelectorAll(`[data-fav="${t.dataset.fav}"]`).forEach(b=>b.setAttribute('aria-pressed',!!SAVE.fav[t.dataset.fav]));if((location.hash||'')==='#defterim')viewMine();return;}
  if(t.dataset.cat!=null){Q.cat=t.dataset.cat;Q.page=1;document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===Q.cat));renderCatalog();return;}
  if(t.dataset.more){Q.page++;renderCatalog();return;}
  if(t.dataset.clear){Object.assign(Q,{cat:'',lvl:0,q:'',fam:'',page:1});viewHome();return;}
  if(t.dataset.jump){e.preventDefault();document.getElementById(t.dataset.jump).scrollIntoView({behavior:'smooth'});return;}
  if(!CUR)return;
  if(t.dataset.tab){CUR.tab=t.dataset.tab;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===CUR.tab));refresh();if(!t.closest('.tabs'))document.querySelector('.tabs').scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(t.dataset.view){CUR.view=t.dataset.view;refresh();return;}
  if(t.dataset.step!=null){CUR.step=+t.dataset.step;refresh();return;}
  if(t.dataset.go){const a=SAVE.steps[CUR.pr.id]=SAVE.steps[CUR.pr.id]||[];const si=curStep(),n=CUR.c.steps.length;
    if(+t.dataset.go>0){a[si]=true;persist();CUR.step=Math.min(n-1,si+1);} else CUR.step=Math.max(0,si-1);
    refresh(); if(window.matchMedia('(max-width:860px)').matches) document.getElementById('viewer').scrollIntoView({behavior:'smooth'}); return;}
  if(t.id==='reset'){delete SAVE.params[CUR.pr.id];persist();CUR.pr.params.forEach(q=>{CUR.p[q.k]=q.def;document.getElementById('r-'+q.k).value=q.def;document.getElementById('n-'+q.k).value=q.def;});CUR.c=compute(CUR.pr,CUR.p);refresh();}
});

</script>
